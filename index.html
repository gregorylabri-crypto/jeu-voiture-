<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kart Legends V2 · France vs Espagne</title>
<style>
:root{
  --night:#070b18; --panel:rgba(10,16,34,.82); --line:rgba(130,160,255,.18);
  --fr:#2f6bff; --fr2:#7fb0ff; --es:#ff2e44; --es2:#ffb14d;
  --gold:#ffd34d; --cyan:#45e8ff; --paper:#eaf0ff; --dim:#8fa0c8;
  --disp:'Arial Black','Segoe UI Black',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night);touch-action:none;overscroll-behavior:none}
body{font-family:var(--body);color:var(--paper);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(3,5,14,.55) 100%)}
#sunflare{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(circle at 72% 22%,rgba(255,190,110,.55),rgba(255,120,60,.18) 25%,transparent 55%);transition:opacity .2s}

/* ---------- écrans ---------- */
.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.screen.active{display:flex}
.scroller{width:100%;max-width:980px;max-height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 2px}

/* signature : bandeau diagonal FR / ES */
.vsbar{position:relative;width:min(92vw,560px);height:8px;border-radius:4px;overflow:hidden}
.vsbar::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,var(--fr) 0 46%,#fff 46% 54%,var(--es) 54% 100%)}

h1.logo{font-family:var(--disp);font-style:italic;font-size:clamp(34px,9vw,74px);line-height:.94;letter-spacing:-1px;text-transform:uppercase;text-align:center;
  background:linear-gradient(180deg,#fff 20%,#9db8ff 60%,#5c7dff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(60,110,255,.45));transform:skewX(-6deg)}
.sub{font-family:var(--disp);font-style:italic;letter-spacing:3px;font-size:clamp(12px,3vw,17px);text-transform:uppercase;display:flex;gap:10px;align-items:center}
.sub .fr{color:var(--fr2)} .sub .es{color:#ff8a94}
.sub .vs{background:var(--gold);color:#211500;padding:2px 8px;border-radius:4px;transform:skewX(-10deg);font-size:.9em}

.btn{font-family:var(--disp);font-style:italic;text-transform:uppercase;letter-spacing:1.5px;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(100deg,#1d3fae,#2f6bff 55%,#45e8ff);padding:15px 30px;font-size:clamp(15px,3.6vw,19px);border-radius:12px;
  box-shadow:0 6px 22px rgba(47,107,255,.4),inset 0 1px 0 rgba(255,255,255,.35);transform:skewX(-6deg);transition:transform .12s,box-shadow .12s;min-width:230px}
.btn>span{display:inline-block;transform:skewX(6deg)}
.btn:active{transform:skewX(-6deg) scale(.96)}
.btn.red{background:linear-gradient(100deg,#8f0f22,#ff2e44 55%,#ffb14d);box-shadow:0 6px 22px rgba(255,46,68,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:rgba(20,30,60,.7);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:10px 18px;min-width:0;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.hintline{color:var(--dim);font-size:12.5px;text-align:center;line-height:1.5;max-width:520px}
kbd{background:#182347;border:1px solid #2c3d77;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:var(--body);font-size:11px;color:#cfe0ff}

/* ---------- sélection pilote ---------- */
.banner{font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:clamp(15px,4vw,22px);letter-spacing:1px;
  padding:8px 22px;border-radius:10px;transform:skewX(-8deg);background:linear-gradient(100deg,rgba(47,107,255,.25),rgba(69,232,255,.12));border:1px solid var(--line)}
.banner.p2{background:linear-gradient(100deg,rgba(255,46,68,.28),rgba(255,177,77,.12))}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.teamcol{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;backdrop-filter:blur(8px)}
.teamhead{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-style:italic;font-size:13px;letter-spacing:2px;margin:2px 4px 10px;text-transform:uppercase}
.flag{width:26px;height:17px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5);flex:none}
.flag.fr{background:linear-gradient(90deg,#0a3d9c 33.3%,#f2f4ff 33.3% 66.6%,#e2213a 66.6%)}
.flag.es{background:linear-gradient(180deg,#c81a26 25%,#ffc400 25% 75%,#c81a26 75%)}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.char{position:relative;border:1px solid var(--line);border-radius:12px;padding:9px 6px 7px;text-align:center;cursor:pointer;background:rgba(16,24,52,.6);transition:transform .12s,border-color .12s,box-shadow .12s}
.char .nm{font-family:var(--disp);font-style:italic;font-size:12px;letter-spacing:.4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char .num{position:absolute;top:5px;right:7px;font-family:var(--disp);font-size:10px;color:var(--dim)}
.char .dot{width:30px;height:30px;border-radius:50%;margin:0 auto 7px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.25)}
.char .tag{font-size:9.5px;color:var(--dim);letter-spacing:.5px}
.char:hover{transform:translateY(-2px)}
.char.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 8px 24px rgba(255,211,77,.25);background:rgba(40,44,30,.55)}
.char.taken{opacity:.35;pointer-events:none}
#sel-stats{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;backdrop-filter:blur(8px)}
#sel-stats .who{font-family:var(--disp);font-style:italic;font-size:clamp(18px,5vw,26px);display:flex;align-items:center;gap:10px;text-transform:uppercase}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;flex:1;min-width:210px}
.bars label{font-size:10.5px;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase}
.bar{height:9px;border-radius:5px;background:#101a38;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;border-radius:5px;background:linear-gradient(90deg,var(--fr),var(--cyan));transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.bar.red i{background:linear-gradient(90deg,var(--es),var(--es2))}

/* ---------- barre d'action fixe (sélection pilote & circuit) ---------- */
#s-select,#s-circuit{justify-content:flex-start;align-items:stretch;padding:0}
#s-select>.scroller,#s-circuit>.scroller{max-width:none;flex:1 1 auto;min-height:0;max-height:none;align-items:center;padding:max(12px,env(safe-area-inset-top)) 12px 10px;-webkit-overflow-scrolling:touch}
#s-select>.scroller>*,#s-circuit>.scroller>*{width:100%;max-width:980px}
.seldock{flex:none;width:100%;display:flex;flex-direction:column;gap:9px;align-items:center;z-index:2;
  padding:11px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(7,11,24,0),rgba(7,11,24,.86) 42%,rgba(6,9,20,.97));
  backdrop-filter:blur(13px);border-top:1px solid var(--line);box-shadow:0 -14px 34px rgba(0,0,0,.45)}
.seldock>*{width:100%;max-width:980px}
.seldock .btnrow{display:flex;gap:10px;flex-wrap:nowrap}
.seldock #b-continue,.seldock #b-go{flex:1 1 auto;min-width:0}
.seldock .btn.ghost{flex:0 0 auto;min-width:0}
.seldock #sel-stats{padding:9px 13px;gap:5px 18px}
@media (max-width:640px){
  .seldock #sel-stats .who{font-size:15px}
  .seldock #sel-stats .bars{min-width:150px}
  .seldock #sel-stats .bars label{font-size:9px;letter-spacing:1px}
  .seldock #sel-stats .bar{height:7px}
  .seldock .btn{padding:14px 18px}
}

/* ---------- sélection circuit ---------- */
.circgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:100%}
.circ{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s;backdrop-filter:blur(8px)}
.circ:hover{transform:translateY(-3px)}
.circ.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.circ canvas{width:100%;height:118px;border-radius:10px;background:#0a1128;display:block}
.circ .cn{font-family:var(--disp);font-style:italic;font-size:16px;margin:9px 0 2px;text-transform:uppercase}
.circ .cd{font-size:11.5px;color:var(--dim);line-height:1.45;min-height:32px}
.circ .stars{color:var(--gold);font-size:12px;letter-spacing:2px;margin-top:5px}

/* ---------- HUD course ---------- */
#s-race{justify-content:flex-start;pointer-events:none;padding:0}
#s-race *{pointer-events:none}
.hud{position:absolute;inset:0}
.plate{position:absolute;font-family:var(--disp);font-style:italic;transform:skewX(-8deg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;backdrop-filter:blur(6px)}
.plate b{display:inline-block;transform:skewX(8deg)}
.pos-plate{left:12px;top:calc(10px + env(safe-area-inset-top));font-size:clamp(22px,6vw,34px);border-left:5px solid var(--gold)}
.pos-plate small{font-size:.45em;color:var(--dim);margin-left:2px}
.lap-plate{left:12px;top:calc(66px + env(safe-area-inset-top));font-size:13px;letter-spacing:1px;color:#cfe0ff}
.time-plate{left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%) skewX(-8deg);font-size:15px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.cp-plate{left:12px;top:calc(104px + env(safe-area-inset-top));font-size:10.5px;letter-spacing:1px;color:var(--dim);padding:4px 10px}
.speedo{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:132px;height:132px}
.dial{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 46%,#0d1530 58%,#070b18 78%);border:2px solid rgba(120,150,255,.25);box-shadow:0 8px 30px rgba(0,0,0,.6),inset 0 0 26px rgba(50,90,255,.18)}
.dial::after{content:'';position:absolute;inset:8px;border-radius:50%;background:
  conic-gradient(from 210deg,var(--cyan) 0deg,var(--fr) 150deg,var(--es) 240deg,transparent 241deg 360deg);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 74%,transparent 75%);mask:radial-gradient(circle,transparent 62%,#000 63% 74%,transparent 75%);opacity:.9}
.needle{position:absolute;left:50%;top:50%;width:4px;height:52px;background:linear-gradient(#fff,#ff5f5f);border-radius:3px;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(-120deg);box-shadow:0 0 8px rgba(255,90,90,.9)}
.needle::after{content:'';position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#e7ecff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 8px #fff}
.kmh{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:var(--disp);font-style:italic;font-size:24px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(80,140,255,.8)}
.kmh small{font-size:10px;display:block;color:var(--dim);letter-spacing:2px}
.nitro{position:absolute;right:158px;bottom:calc(28px + env(safe-area-inset-bottom));width:15px;height:112px;border-radius:9px;background:#0b1230;border:1px solid rgba(110,230,255,.3);overflow:hidden}
.nitro i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#b6f7ff,var(--cyan) 40%,#3f6bff);box-shadow:0 0 14px var(--cyan);transition:height .08s}
.nitro.full{animation:npulse .7s infinite alternate}
@keyframes npulse{from{box-shadow:0 0 4px var(--cyan)}to{box-shadow:0 0 18px var(--cyan)}}
.nitro span{position:absolute;left:-4px;top:-20px;font-size:12px}
.wrong{position:absolute;left:50%;top:26%;transform:translateX(-50%) skewX(-8deg);font-family:var(--disp);font-style:italic;font-size:clamp(20px,6vw,32px);color:#ff5f6d;text-shadow:0 0 18px rgba(255,50,70,.8);display:none;animation:blink .4s infinite alternate}
@keyframes blink{from{opacity:.35}to{opacity:1}}
.digital{position:absolute;right:14px;bottom:14px;font-family:var(--disp);font-style:italic;font-size:22px;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(80,140,255,.8)}
.digital small{font-size:10px;color:var(--dim)}
.nitro-mini{position:absolute;right:16px;bottom:46px;width:90px;height:8px;border-radius:4px;background:#0b1230;border:1px solid rgba(110,230,255,.3);overflow:hidden}
.nitro-mini i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3f6bff,var(--cyan));box-shadow:0 0 10px var(--cyan)}
.ptag{position:absolute;left:12px;bottom:12px;font-family:var(--disp);font-style:italic;font-size:11px;letter-spacing:2px;color:var(--dim)}

#minimap{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));width:138px;height:138px;background:rgba(8,12,28,.68);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
#standings{position:absolute;left:12px;top:calc(148px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-variant-numeric:tabular-nums}
#standings .row{display:flex;align-items:center;gap:6px;background:rgba(8,12,28,.55);border-radius:6px;padding:2px 8px 2px 5px;border:1px solid transparent;max-width:150px}
#standings .row.me{border-color:var(--gold);background:rgba(50,42,12,.6);font-weight:700}
#standings .pp{width:14px;color:var(--dim);font-family:var(--disp);font-size:9px;font-style:italic}
#standings .cdot{width:8px;height:8px;border-radius:50%;flex:none}
#standings .nn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#count{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--disp);font-style:italic;font-size:clamp(70px,22vw,150px);
  background:linear-gradient(180deg,#fff,#ffd34d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 26px rgba(255,190,60,.5));display:none}
#count.pop{animation:cpop .92s ease-out}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(2.1);opacity:0}18%{opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:.9}}
#toastbox{position:absolute;left:50%;top:16%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{font-family:var(--disp);font-style:italic;font-size:clamp(15px,4.5vw,22px);letter-spacing:1px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--cyan);padding:7px 20px;border-radius:10px;transform:skewX(-8deg);animation:tin 2.4s forwards}
.toast.gold{border-left-color:var(--gold);color:var(--gold)}
@keyframes tin{0%{opacity:0;transform:skewX(-8deg) translateY(-14px)}12%,80%{opacity:1;transform:skewX(-8deg) translateY(0)}100%{opacity:0;transform:skewX(-8deg) translateY(-8px)}}
#topbar{position:absolute;right:158px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
#topbar button{pointer-events:auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:#dfe8ff;font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}

/* tactile */
#touch{position:absolute;inset:0;display:none}
body.touch #touch{display:block}
#joy{position:absolute;left:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:rgba(14,22,48,.5);border:1.5px solid rgba(130,160,255,.35);pointer-events:auto;backdrop-filter:blur(4px)}
#stick{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#7fa4ff,#2f4db8);box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.5)}
#b-boost{position:absolute;right:22px;bottom:calc(160px + env(safe-area-inset-bottom));width:88px;height:88px;border-radius:50%;pointer-events:auto;border:0;cursor:pointer;
  font-family:var(--disp);font-style:italic;font-size:14px;color:#04121a;background:radial-gradient(circle at 32% 28%,#c9fbff,var(--cyan) 55%,#2b7bff);box-shadow:0 6px 22px rgba(69,232,255,.55),inset 0 -5px 12px rgba(0,40,90,.55)}
#b-boost:active{transform:scale(.92)}
#b-brake{position:absolute;right:126px;bottom:calc(140px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;pointer-events:auto;border:0;cursor:pointer;
  font-family:var(--disp);font-size:10px;font-style:italic;color:#2a0308;background:radial-gradient(circle at 32% 28%,#ffd2d8,#ff5f6d 60%,#b31226);box-shadow:0 5px 16px rgba(255,60,80,.45),inset 0 -4px 10px rgba(90,0,10,.5)}
body.touch .speedo{right:120px;bottom:calc(150px + env(safe-area-inset-bottom));width:104px;height:104px;opacity:.92}
body.touch .speedo .needle{height:40px}
body.touch .speedo .kmh{font-size:19px;bottom:16px}
body.touch .nitro{right:242px;bottom:calc(158px + env(safe-area-inset-bottom));height:92px}
body.touch #standings{display:none}

/* split 2 joueurs */
body.split .hud.h0{bottom:50%}
body.split .hud.h1{top:50%}
body.split .hud .speedo,body.split .hud .nitro,body.split #standings{display:none}
body.split .hud{position:absolute;left:0;right:0}
body.split .hud .pos-plate{font-size:22px}
body.split .hud .time-plate{display:none}
body.split #minimap{top:50%;transform:translateY(-50%)}
#splitline{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,var(--fr),#fff,var(--es));display:none;z-index:6;box-shadow:0 0 12px rgba(255,255,255,.5)}
body.split #splitline{display:block}

/* objets */
.itembox{position:absolute;left:12px;top:calc(78px + env(safe-area-inset-top));width:60px;height:60px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:31px;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.itembox .iv{filter:drop-shadow(0 0 6px rgba(120,200,255,.7))}
.itembox.empty .iv{opacity:.22;filter:none}
.itembox.flash{animation:ipulse .32s 4 alternate}
@keyframes ipulse{from{border-color:var(--line);transform:scale(1)}to{border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 22px rgba(255,211,77,.6)}}
body.split .itembox{width:44px;height:44px;font-size:23px;top:56px}
body.touch .itembox{left:auto;right:16px;bottom:calc(268px + env(safe-area-inset-bottom));top:auto}
#b-item{position:absolute;right:36px;bottom:calc(262px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;pointer-events:auto;border:1px solid rgba(255,211,77,.5);cursor:pointer;font-size:26px;color:#fff;background:radial-gradient(circle at 32% 28%,#3a4a80,#141d3e 70%);box-shadow:0 5px 16px rgba(0,0,0,.5)}
#b-item:active{transform:scale(.92)}
#b-item.empty{opacity:.35}
body.touch .itembox{display:none}

/* pause / résultats / chargement */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px;align-items:center;max-width:min(92vw,560px);width:100%}
.panel h2{font-family:var(--disp);font-style:italic;text-transform:uppercase;font-size:clamp(20px,5.5vw,30px);letter-spacing:1px;text-align:center}
#res-table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
#res-table td{padding:5px 7px;border-bottom:1px solid rgba(130,160,255,.12)}
#res-table tr.me td{background:rgba(255,211,77,.1);font-weight:700}
#res-table .p{font-family:var(--disp);font-style:italic;width:30px;color:var(--dim)}
#res-table tr:nth-child(1) .p{color:var(--gold)} #res-table tr:nth-child(2) .p{color:#cfd8ea} #res-table tr:nth-child(3) .p{color:#e09a5f}
#res-table .cdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
#res-stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-size:11px;letter-spacing:.6px;background:rgba(20,32,66,.8);border:1px solid var(--line);border-radius:20px;padding:5px 12px;color:#cfe0ff}
.chip b{color:var(--gold)}

/* ============ PARTICULES (Points + shader) ============ */
const P_VERT=`attribute float aSize;attribute float aAlpha;attribute vec3 aColor;varying float vA;varying vec3 vC;
void main(){vC=aColor;vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*(230.0/max(1.0,-mv.z));gl_Position=projectionMatrix*mv;}`;
const P_FRAG_ROUND=`varying float vA;varying vec3 vC;void main(){vec2 uv=gl_PointCoord-vec2(.5);float d=length(uv);float a=smoothstep(.5,.1,d)*vA;if(a<.015)discard;gl_FragColor=vec4(vC,a);}`;
const P_FRAG_SQ=`varying float vA;varying vec3 vC;void main(){if(vA<.02)discard;gl_FragColor=vec4(vC,vA);}`;
class PSys{
 constructor(scene,n,additive,round){this.n=n;this.head=0;
  this.px=new Float32Array(n*3);this.vx=new Float32Array(n*3);
  this.life=new Float32Array(n);this.tot=new Float32Array(n);this.sz=new Float32Array(n);
  this.grav=new Float32Array(n);this.drag=new Float32Array(n);
  this.aSize=new Float32Array(n);this.aAlpha=new Float32Array(n);this.aColor=new Float32Array(n*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(this.px,3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aSize',new THREE.BufferAttribute(this.aSize,1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aAlpha',new THREE.BufferAttribute(this.aAlpha,1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aColor',new THREE.BufferAttribute(this.aColor,3).setUsage(THREE.DynamicDrawUsage));
  g.userData.shared=false;
  const m=new THREE.ShaderMaterial({vertexShader:P_VERT,fragmentShader:round?P_FRAG_ROUND:P_FRAG_SQ,transparent:true,depthWrite:false,
   blending:additive?THREE.AdditiveBlending:THREE.NormalBlending});
  this.pts=new THREE.Points(g,m);this.pts.frustumCulled=false;scene.add(this.pts);this.geo=g;}
 spawn(x,y,z,vx,vy,vz,life,size,r,g,b,grav,drag){const i=this.head;this.head=(this.head+1)%this.n;
  this.px[i*3]=x;this.px[i*3+1]=y;this.px[i*3+2]=z;this.vx[i*3]=vx;this.vx[i*3+1]=vy;this.vx[i*3+2]=vz;
  this.life[i]=life;this.tot[i]=life;this.sz[i]=size;this.grav[i]=grav||0;this.drag[i]=drag||0;
  this.aColor[i*3]=r;this.aColor[i*3+1]=g;this.aColor[i*3+2]=b;}
 update(dt){for(let i=0;i<this.n;i++){if(this.life[i]<=0){this.aAlpha[i]=0;continue}
   this.life[i]-=dt;const k=Math.max(this.life[i]/this.tot[i],0);
   this.vx[i*3+1]+=this.grav[i]*dt;const dr=1-this.drag[i]*dt;
   this.vx[i*3]*=dr;this.vx[i*3+1]*=dr;this.vx[i*3+2]*=dr;
   this.px[i*3]+=this.vx[i*3]*dt;this.px[i*3+1]+=this.vx[i*3+1]*dt;this.px[i*3+2]+=this.vx[i*3+2]*dt;
   this.aAlpha[i]=k*k;this.aSize[i]=this.sz[i]*(0.6+0.7*(1-k));}
  this.geo.attributes.position.needsUpdate=true;this.geo.attributes.aAlpha.needsUpdate=true;
  this.geo.attributes.aSize.needsUpdate=true;this.geo.attributes.aColor.needsUpdate=true;}
}

/* env-map procédurale (studio) → reflets sur les carrosseries */
let ENVMAP=null;
function makeStudioEnv(){
 const S=128,faces=[];
 const paint=(fn)=>{const c=document.createElement('canvas');c.width=c.height=S;fn(c.getContext('2d'),S);return c};
 // +X -X +Z -Z : horizon studio bleu nuit avec bandeau lumineux
 const side=paint((g,s)=>{const gr=g.createLinearGradient(0,0,0,s);
  gr.addColorStop(0,'#0a1330');gr.addColorStop(.42,'#16234d');gr.addColorStop(.5,'#3a5aa8');
  gr.addColorStop(.54,'#8fb4ff');gr.addColorStop(.6,'#22305e');gr.addColorStop(1,'#05070f');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  g.fillStyle='rgba(180,210,255,.10)';for(let i=0;i<3;i++)g.fillRect(0,s*.2+i*s*.09,s,2)});
 // +Y (ciel/plafond avec spots)
 const top=paint((g,s)=>{const gr=g.createRadialGradient(s/2,s/2,4,s/2,s/2,s*.7);
  gr.addColorStop(0,'#eaf1ff');gr.addColorStop(.35,'#9fb8f0');gr.addColorStop(1,'#26325e');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  g.fillStyle='rgba(255,255,255,.9)';[[.3,.3],[.7,.32],[.5,.7]].forEach(p=>{g.beginPath();g.arc(p[0]*s,p[1]*s,7,0,TAU);g.fill()})});
 // -Y (sol sombre)
 const bot=paint((g,s)=>{g.fillStyle='#05070e';g.fillRect(0,0,s,s);
  const gr=g.createRadialGradient(s/2,s/2,2,s/2,s/2,s*.6);gr.addColorStop(0,'rgba(60,90,160,.35)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s)});
 const cvs=[side,side,top,bot,side,side];
 const tex=new THREE.CubeTexture(cvs);tex.needsUpdate=true;tex.userData={shared:true};ENVMAP=tex;return tex}

const MATC={};

  accent.envMap=env;accent.reflectivity=.55;accent.combine=THREE.MixOperation}
 MATC[c.id]={
  body:mk(body),accent:mk(accent),

  hair:mk(new THREE.MeshLambertMaterial({color:c.hair})),

const FS_VERT='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}';
const BRIGHT_FRAG='uniform sampler2D tDiffuse;uniform float uThresh;varying vec2 vUv;'+
 'void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float l=dot(c,vec3(.2126,.7152,.0722));'+
 'float k=smoothstep(uThresh,uThresh+.4,l);gl_FragColor=vec4(c*k*k,1.0);}';
const BLUR_FRAG='uniform sampler2D tDiffuse;uniform vec2 uDir;varying vec2 vUv;'+
 'void main(){float w0=.227,w1=.194,w2=.121,w3=.054,w4=.016;vec3 s=texture2D(tDiffuse,vUv).rgb*w0;'+
 'for(int i=1;i<5;i++){float wi=i==1?w1:i==2?w2:i==3?w3:w4;vec2 o=uDir*float(i);'+
 's+=texture2D(tDiffuse,vUv+o).rgb*wi;s+=texture2D(tDiffuse,vUv-o).rgb*wi;}gl_FragColor=vec4(s,1.0);}';
const COMP_FRAG='uniform sampler2D tScene;uniform sampler2D tBloom;uniform float uBloom,uExp,uVig,uSat,uBoost;varying vec2 vUv;'+
 'vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.0,1.0);}'+
 'void main(){vec2 uv=vUv;vec2 ctr=uv-.5;vec3 scene;float b=uBoost;'+
 'if(b>0.001){float amt=b*.15;vec3 acc=vec3(0.);'+
 'for(int i=0;i<6;i++){float t=float(i)/5.0;vec2 su=uv-ctr*amt*t;float ca=b*.006*t;'+
 'acc.r+=texture2D(tScene,su+ctr*ca).r;acc.g+=texture2D(tScene,su).g;acc.b+=texture2D(tScene,su-ctr*ca).b;}'+
 'scene=acc/6.0;}else{scene=texture2D(tScene,uv).rgb;}'+
 'vec3 bloom=texture2D(tBloom,uv).rgb;vec3 col=scene+bloom*uBloom;col*=uExp;col=aces(col);'+
 'float l=dot(col,vec3(.2126,.7152,.0722));col=mix(vec3(l),col,uSat);'+
 'float vig=smoothstep(1.15,.32,length(ctr)*1.28);col*=mix(1.0,vig,uVig);'+
 'gl_FragColor=vec4(col,1.0);}';
class PostFX{
 constructor(){
  this.quadScene=new THREE.Scene();this.quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  this.geo=new THREE.PlaneGeometry(2,2);

  this.mBlur=new THREE.ShaderMaterial({vertexShader:FS_VERT,fragmentShader:BLUR_FRAG,uniforms:{tDiffuse:{value:null},uDir:{value:new THREE.Vector2()}},depthTest:false,depthWrite:false});
  this.mComp=new THREE.ShaderMaterial({vertexShader:FS_VERT,fragmentShader:COMP_FRAG,depthTest:false,depthWrite:false,
   uniforms:{tScene:{value:null},tBloom:{value:null},uBloom:{value:QUALITY.mobile?.9:1.15},uExp:{value:1.28},uVig:{value:.5},uSat:{value:1.14},uBoost:{value:0}}});
  this.quad=new THREE.Mesh(this.geo,this.mComp);this.quad.frustumCulled=false;this.quadScene.add(this.quad);

  const opt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type,depthBuffer:true,stencilBuffer:false};
  const bopt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type,depthBuffer:false,stencilBuffer:false};
  this.rtScene=new THREE.WebGLRenderTarget(2,2,opt);

  this.rtB=new THREE.WebGLRenderTarget(2,2,bopt);
  this.boost=0;this.setSize();
 }
 setSize(){const v=renderer.getDrawingBufferSize(new THREE.Vector2());
  this.w=Math.max(2,v.x);this.h=Math.max(2,v.y);
  this.rtScene.setSize(this.w,this.h);
  const bw=Math.max(2,Math.floor(this.w*QUALITY.bloomScale)),bh=Math.max(2,Math.floor(this.h*QUALITY.bloomScale));
  this.bw=bw;this.bh=bh;this.rtA.setSize(bw,bh);this.rtB.setSize(bw,bh);}
 pass(mat,target){this.quad.material=mat;renderer.setRenderTarget(target);
  renderer.setViewport(0,0,target?target.width:this.w,target?target.height:this.h);
  renderer.render(this.quadScene,this.quadCam);}
 render(drawCb,boost){
  this.boost=damp(this.boost,boost||0,10,.033);
  const pr=renderer.getPixelRatio();
  // 1) scène → rtScene
  renderer.setRenderTarget(this.rtScene);renderer.setScissorTest(false);renderer.clear();
  drawCb(pr);
  // 2) extraction des zones lumineuses
  this.mBright.uniforms.tDiffuse.value=this.rtScene.texture;
  this.pass(this.mBright,this.rtA);
  // 3) flou séparable (ping-pong)
  for(let i=0;i<QUALITY.bloomPasses;i++){
   this.mBlur.uniforms.tDiffuse.value=this.rtA.texture;this.mBlur.uniforms.uDir.value.set((1.4+i)/this.bw,0);this.pass(this.mBlur,this.rtB);
   this.mBlur.uniforms.tDiffuse.value=this.rtB.texture;this.mBlur.uniforms.uDir.value.set(0,(1.4+i)/this.bh);this.pass(this.mBlur,this.rtA);
  }
  // 4) composite → écran
  this.mComp.uniforms.tScene.value=this.rtScene.texture;
  this.mComp.uniforms.tBloom.value=this.rtA.texture;
  this.mComp.uniforms.uBoost.value=this.boost;

  renderer.setViewport(0,0,innerWidth,innerHeight);renderer.setScissorTest(false);
  renderer.render(this.quadScene,this.quadCam);

}

  fxI=Math.max(fxI,k.nitroOn||k.padT>0?1:k.miniT>0?.55:0,Math.max(0,spd-.72)*2.4)});
 drawFX(clamp(fxI,0,1));
 // minimap
 MMCTX.clearRect(0,0,276,276);R.track.drawMinimap(MMCTX,276);
 for(const k of R.karts){const p=R.track.mapPt(k.pos);
  if(k.human){MMCTX.fillStyle='#fff';MMCTX.beginPath();MMCTX.arc(p[0],p[1],6,0,TAU);MMCTX.fill()}

function updateStandingsHUD(R){if(R.humans.length>1)return;

function drawFX(I){const w=FX.width,h=FX.height;FXG.clearRect(0,0,w,h);
 if(I<.02)return;const cx=w/2,cy=h/2,n=Math.floor(14+I*32),R=Math.max(w,h)*.78;
 for(let i=0;i<n;i++){const a=rand(0,TAU),r0=R*(.5-I*.16),r1=R,al=(.09+I*.17)*rand(.5,1);
  FXG.strokeStyle=I>.7?'rgba(175,238,255,'+al+')':'rgba(255,255,255,'+al+')';
  FXG.lineWidth=rand(1,2.7);FXG.beginPath();
  FXG.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);FXG.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);FXG.stroke()}}

const keys={};

 if(APP.state==='race'&&(e.code==='Escape'||e.code==='KeyP'))togglePause();

const touch={jx:0,jy:0,jid:null,boost:false,brake:false,fire:false};
function getInput(pi){
 let tf=false;if(pi===0){tf=touch.fire;touch.fire=false}
 if(IS_TOUCH&&pi===0&&(touch.jid!==null||touch.boost||touch.brake))
  return{steer:-touch.jx,throttle:touch.brake||touch.jy>.55?-1:1,nitro:touch.boost,fire:tf};
 if(IS_TOUCH&&pi===0&&APP.race&&APP.race.state==='race'&&APP.mode===1&&!keys.KeyW&&!keys.ArrowUp&&!keys.KeyS&&!keys.ArrowDown)
  return{steer:(keys.KeyA||keys.ArrowLeft?1:0)-(keys.KeyD||keys.ArrowRight?1:0),throttle:1,nitro:!!(keys.ShiftLeft||keys.ShiftRight||keys.Space),fire:tf||!!(keys.KeyE||keys.Enter)};
 if(APP.mode===1)
  return{steer:(keys.KeyA||keys.ArrowLeft?1:0)-(keys.KeyD||keys.ArrowRight?1:0),
   throttle:(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),
   nitro:!!(keys.ShiftLeft||keys.ShiftRight||keys.Space),fire:tf||!!(keys.KeyE||keys.Enter)};
 if(pi===0)return{steer:(keys.KeyA?1:0)-(keys.KeyD?1:0),throttle:(keys.KeyW?1:0)-(keys.KeyS?1:0),nitro:!!(keys.ShiftLeft||keys.Space),fire:tf||!!keys.KeyE};
 return{steer:(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0),throttle:(keys.ArrowUp?1:0)-(keys.ArrowDown?1:0),nitro:!!keys.ShiftRight,fire:!!keys.Enter};}
const joy=qs('#joy'),stick=qs('#stick');
joy.addEventListener('pointerdown',e=>{touch.jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===touch.jid)joyMove(e)});
const joyEnd=e=>{if(e.pointerId===touch.jid){touch.jid=null;touch.jx=touch.jy=0;stick.style.transform='translate(-50%,-50%)'}};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);
 const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
 touch.jx=dx;touch.jy=dy;
 stick.style.transform='translate(-50%,-50%) translate('+dx*34+'px,'+dy*34+'px)'}
const bb=qs('#b-boost'),bk=qs('#b-brake');
bb.addEventListener('pointerdown',e=>{e.preventDefault();touch.boost=true;AUDIO.resume()});
bb.addEventListener('pointerup',()=>touch.boost=false);bb.addEventListener('pointercancel',()=>touch.boost=false);
bk.addEventListener('pointerdown',e=>{e.preventDefault();touch.brake=true});
bk.addEventListener('pointerup',()=>touch.brake=false);bk.addEventListener('pointercancel',()=>touch.brake=false);

/* grille circuits */
function buildCircGrid(){
 CIRCUITS.forEach((t,i)=>{const el=document.createElement('div');el.className='circ'+(i===0?' sel':'');
  const cv=document.createElement('canvas');cv.width=340;cv.height=180;el.appendChild(cv);
  const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,180);
  gr.addColorStop(0,hex(t.sky.top));gr.addColorStop(1,hex(t.sky.bot));
  g.fillStyle=gr;g.globalAlpha=.55;g.fillRect(0,0,340,180);g.globalAlpha=1;
  const crv=new THREE.CatmullRomCurve3(t.pts.map(p=>new THREE.Vector3(p[0],0,p[2])),true,'catmullrom',.5);
  const ps=crv.getPoints(150);
  let mx=1e9,Mx=-1e9,mz=1e9,Mz=-1e9;
  ps.forEach(p=>{mx=Math.min(mx,p.x);Mx=Math.max(Mx,p.x);mz=Math.min(mz,p.z);Mz=Math.max(Mz,p.z)});
  const sc=Math.min(300/(Mx-mx),140/(Mz-mz)),ox=(340-(Mx-mx)*sc)/2,oz=(180-(Mz-mz)*sc)/2;
  g.lineJoin=g.lineCap='round';g.beginPath();
  ps.forEach((p,k)=>{const x=ox+(p.x-mx)*sc,y=oz+(p.z-mz)*sc;k?g.lineTo(x,y):g.moveTo(x,y)});
  g.closePath();
  g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=10;g.stroke();
  g.strokeStyle=t.color;g.lineWidth=4;g.shadowColor=t.color;g.shadowBlur=9;g.stroke();g.shadowBlur=0;
  g.fillStyle='#fff';g.beginPath();g.arc(ox+(ps[0].x-mx)*sc,oz+(ps[0].z-mz)*sc,4,0,TAU);g.fill();
  const info=document.createElement('div');
  info.innerHTML='<div class="cn">'+t.name+'</div><div class="cd">'+t.desc+'</div>'+
   '<div class="stars">'+'★'.repeat(t.diff)+'☆'.repeat(5-t.diff)+' · '+t.laps+' tours</div>';
  el.appendChild(info);
  el.addEventListener('click',()=>{APP.circuit=i;
   document.querySelectorAll('.circ').forEach((e2,k)=>e2.classList.toggle('sel',k===i))});
  qs('#circ-grid').appendChild(el)})}

function digitTex(d,col){return mkTex(64,64,(g)=>{g.fillStyle=col;g.font='900 44px Arial Black,Arial';
 g.textAlign='center';g.textBaseline='middle';g.fillText(d,32,36)},true)}
function buildPodium(R){clearPodium();
 const sc=new THREE.Scene();sc.background=new THREE.Color(R.circ.sky.mid);
 sc.fog=new THREE.Fog(R.circ.sky.mid,26,95);
 sc.add(new THREE.HemisphereLight(0xffffff,0x1c2244,1.02));
 const d=new THREE.DirectionalLight(0xfff0d8,1.15);d.position.set(6,11,7);sc.add(d);
 const floor=new THREE.Mesh(GEO.cyl,new THREE.MeshLambertMaterial({color:0x141b36}));
 floor.scale.set(17,.3,17);floor.position.y=-.15;sc.add(floor);
 const hs=[2,1.35,.9],xs=[0,-3.1,3.1],cols=[0xd9a92c,0x9aa5b8,0x9c6136];
 const karts=[];
 R.standings.slice(0,3).forEach((k,i)=>{
  const ped=new THREE.Mesh(GEO.box,new THREE.MeshPhongMaterial({color:cols[i],shininess:70}));
  ped.scale.set(2.7,hs[i],2.7);ped.position.set(xs[i],hs[i]/2,0);sc.add(ped);
  const num=new THREE.Mesh(GEO.plane,new THREE.MeshBasicMaterial({map:digitTex(''+(i+1),'#fff'),transparent:true}));
  num.scale.set(1.3,1.3,1);num.position.set(xs[i],hs[i]/2,1.37);sc.add(num);
  const kv=buildKart(k.c,false);kv.grp.position.set(xs[i],hs[i],0);
  kv.grp.rotation.y=Math.PI+(i===0?0:i===1?.35:-.35);
  sc.add(kv.grp);karts.push({kv,base:hs[i]})});
 const conf=new PSys(sc,420,false,false);
 const cam=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,220);
 const PAL=[[1,.32,.36],[1,.84,.3],[.3,.9,1],[.45,1,.55],[.8,.5,1],[1,1,1]];
 POD={scene:sc,cam,conf,karts,t:0,
  update(rdt){this.t+=rdt;
   cam.position.set(Math.sin(this.t*.3)*9.6,3.6+Math.sin(this.t*.55)*.6,Math.cos(this.t*.3)*9.6);
   cam.lookAt(0,1.7,0);
   const rate=this.t<7?80:12;
   if(Math.random()<rdt*rate){const c=PAL[randi(0,PAL.length-1)];
    conf.spawn(rand(-6,6),7.6,rand(-4,4),rand(-1,1),rand(-2,-1),rand(-1,1),
     rand(2.2,3.4),rand(.14,.24),c[0],c[1],c[2],-2.6,.4)}
   conf.update(rdt);
   const w=this.karts[0];
   w.kv.grp.position.y=w.base+Math.abs(Math.sin(this.t*3))*.24;
   this.karts.forEach(o=>o.kv.spins.forEach(s=>s.rotation.x+=rdt*2))}}}

/* ============ BOUCLE PRINCIPALE ============ */
function drawSceneFull(scene,cam,pr){renderer.setScissorTest(false);
 renderer.setViewport(0,0,innerWidth*pr,innerHeight*pr);renderer.render(scene,cam)}
function drawSceneRace(R,pr){if(R.humans.length===1){drawSceneFull(R.scene,R.cams[0].cam,pr);return}
 const w=innerWidth*pr,h=innerHeight*.5*pr;
 renderer.setScissorTest(true);
 renderer.setViewport(0,h,w,h);renderer.setScissor(0,h,w,h);renderer.render(R.scene,R.cams[0].cam);
 renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(R.scene,R.cams[1].cam);
 renderer.setScissorTest(false)}
function renderFull(scene,cam){renderer.setRenderTarget(null);drawSceneFull(scene,cam,1)}
function raceBoost(R){let b=0;for(const k of R.humans){const spd=clamp(Math.abs(k.v)/k.phys.vmax,0,1);
  let x=k.nitroOn?1:k.padT>0?.7:k.miniT>0?.4:0;x=Math.max(x,Math.max(0,spd-.82)*3.2);b=Math.max(b,x)}return clamp(b,0,1)}
function renderRace(R){
 if(POST){POST.render(pr=>drawSceneRace(R,pr),raceBoost(R));return}
 renderer.setRenderTarget(null);drawSceneRace(R,1)}
function renderPodium(P){
 if(POST){POST.render(pr=>drawSceneFull(P.scene,P.cam,pr),0);return}
 renderer.setRenderTarget(null);drawSceneFull(P.scene,P.cam,1)}
let lastT=performance.now();
function loop(now){requestAnimationFrame(loop);
 let rdt=(now-lastT)/1000;lastT=now;rdt=Math.min(rdt,.1);
 if(APP.paused)return;
 if(APP.state==='race'&&APP.race){
  slowAcc=rdt>.034?slowAcc+1:Math.max(0,slowAcc-2);
  if(slowAcc>90){
   if(renderer.getPixelRatio()>1){renderer.setPixelRatio(1);resize();LOWPERF=true}
   else if(POST&&QUALITY.bloomPasses>1){QUALITY.bloomPasses=1;QUALITY.bloomScale=.3;POST.setSize()}
   else if(POST){POST=null}
   slowAcc=0}
  APP.race.update(rdt);
  if(APP.race)renderRace(APP.race);
  return}
 if(APP.state==='podium'&&POD){POD.update(rdt);renderPodium(POD);return}
 // menus : aperçu tournant
 APP.titleT+=rdt;
 if(APP.state==='title'&&APP.titleT>3.4){APP.titleT=0;
  APP.titleC=(APP.titleC+1)%CHARS.length;setPreview(CHARS[APP.titleC])}
 prevHold.rotation.y+=rdt*.75;
 if(prevKart)prevKart.spins.forEach(s=>s.rotation.x+=rdt*3);
 renderFull(prevScene,prevCam)}

function resize(){const w=innerWidth,h=innerHeight;
 renderer.setSize(w,h,false);
 if(POST)POST.setSize();
 FX.width=w;FX.height=h;
 prevCam.aspect=w/h;prevCam.updateProjectionMatrix();
 if(POD){POD.cam.aspect=w/h;POD.cam.updateProjectionMatrix()}
 if(APP.race){const n=APP.race.humans.length;
  APP.race.cams.forEach(c=>{c.cam.aspect=n===1?w/h:w/(h/2);c.cam.updateProjectionMatrix()})}}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&APP.state==='race'&&!APP.paused)togglePause()});
